<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Encodage et affichage responsive -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>StreamFlix - Films et séries en streaming illimité</title>
    <meta name="description" content="StreamFlix, votre plateforme de streaming : regardez en illimité les meilleurs films et séries, des tendances du moment aux grands classiques.">
    <meta name="author" content="Lucas Lanoue">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#141414">

    <!-- Open Graph (aperçu lors d'un partage sur les réseaux sociaux) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="StreamFlix - Films et séries en streaming illimité">
    <meta property="og:description" content="Regardez en illimité les meilleurs films et séries sur StreamFlix.">
    <meta property="og:image" content="images/hero-bg.jpg">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="StreamFlix">

    <!-- Icône de l'onglet -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Feuille de styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Script (defer : exécuté après le chargement du HTML) -->
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- Lien d'évitement : premier élément focusable, permet de sauter la navigation au clavier -->
    <a href="#main-content" class="skip-link">Aller au contenu principal</a>

    <!-- ========== EN-TÊTE : logo, navigation, recherche, profil ========== -->
    <header>

        <!-- Logo cliquable : titre principal unique de la page (h1) -->
        <h1>
            <a href="index.html">
                <img src="images/logo.png" alt="StreamFlix - Accueil" width="160" height="40">
            </a>
        </h1>

        <!-- Menu principal -->
        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="index.html" aria-current="page">Accueil</a></li>

                <li><a href="series.html">Séries</a></li>
                <li><a href="ma-liste.html">Ma Liste</a></li>
            </ul>
        </nav>

        <!-- Zone utilisateur : recherche + profil -->
        <div class="user-area">

            <!-- Formulaire de recherche (role="search" : repère pour les lecteurs d'écran) -->
            <form action="#" method="get" role="search">
                <label for="search-input" class="visually-hidden">Rechercher un film ou une série</label>
                <input type="search" id="search-input" name="q"
                       placeholder="Titre, genre, acteur..."
                       required minlength="2" autocomplete="off">
                <button type="submit">Rechercher</button>
            </form>

            <!-- Menu profil : details/summary est ouvrable au clavier (Entrée/Espace) sans JavaScript -->
            <details class="profile-menu">
                <summary>Mon profil</summary>
                <ul>
                    <li><a href="compte.html">Mon compte</a></li>
                    <li><a href="parametres.html">Paramètres</a></li>
                    <li><a href="aide.html">Aide</a></li>
                    <li><a href="deconnexion.html">Se déconnecter</a></li>
                </ul>
            </details>

        </div>

    </header>

    <!-- ========== CONTENU PRINCIPAL ========== -->
    <main id="main-content">

</body>
</html>
